[project]
name = "generals-bots"
version = "2.6.0"
description = "Fast JAX generals.io engine — RL environment and the Generals Competition ruleset"
authors = [{name = "Matej Straka", email = "strakammm@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pygame>=2.6.0",
    "python-socketio[client]>=5.11.4",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# training/ + colab/ (self-play PPO, BC pipelines, Colab training script) --
# not needed to just use the `generals` engine/competition sandbox, so kept
# out of the base dependency list. Install with `pip install -e ".[training]"`.
training = [
    "equinox>=0.13.8",
    "optax>=0.2.8",
    # Lower bounds only, loose on purpose: training/human_replays.py's and
    # training/leaderboard_replays.py's actual pandas/requests usage
    # (read_parquet, basic DataFrame indexing; requests.get+.json()) has been
    # stable for years, so there's no reason to force an upgrade past
    # whatever's already installed. Pinning these to this project's own dev
    # venv version (pandas>=3.0.5, requests>=2.34.2) broke a fresh Colab
    # install: Colab ships pandas==2.2.3/requests==2.32.4 for its own
    # cudf-cu12/dask-cudf-cu12/google-colab stack (which needs pandas<2.4.0),
    # and pip's resolver upgraded past those to satisfy the tighter bound,
    # producing real dependency conflicts with packages already installed.
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.25.0",
]
# colab/train_colab.py's optional --wandb live-metrics dashboard. Separate
# from `training` (unconditionally needed just to run training/ code) since
# this is genuinely opt-in -- colab/train_colab.py only imports wandb inside
# the code path that runs when --wandb is passed, never otherwise, so local
# CPU smoke-testing doesn't need it installed at all.
colab = [
    "wandb>=0.17.0",
]
# modal/train_modal.py's remote-GPU orchestration -- only needed on whatever
# machine actually invokes `modal run`/`modal deploy` (this one), not inside
# the Modal container itself (that gets its own separate modal.Image spec).
modal = [
    "modal>=1.5.4",
]

[project.urls]
Homepage = "https://generals.bot"
Repository = "https://github.com/strakam/generals-bots"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["generals*"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "BLE", "UP", "FA"]
target-version = "py311"
exclude = ["tests", "examples"]
